name: terraform-validate

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform-*.yml"]
  pull_request:
    paths: ["infra/**", ".github/workflows/terraform-*.yml"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - run: terraform fmt -check -recursive infra
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init && tflint --recursive
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          soft_fail: true
          output_format: sarif
          output_file_path: checkov.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with: { sarif_file: checkov.sarif }

  validate:
    needs: static-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - name: Terraform init (no backend)
        run: terraform -chdir=infra/envs/${{ matrix.env }} init -backend=false -input=false
      - name: Terraform validate
        run: terraform -chdir=infra/envs/${{ matrix.env }} validate
