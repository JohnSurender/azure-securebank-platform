name: app-ci-cd

on:
  pull_request:
    paths: ["apps/**", "deploy/**", ".github/workflows/app-ci-cd.yml"]
  push:
    branches: [main]
    paths: ["apps/**", "deploy/**", ".github/workflows/app-ci-cd.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [accounts-service, transactions-service]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest -r apps/${{ matrix.service }}/requirements.txt
      - run: pytest -q apps/${{ matrix.service }}/tests

  build-and-scan:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [accounts-service, transactions-service, web-frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build image (local only, not pushed)
        run: docker build -t securebank/${{ matrix.service }}:${{ github.sha }} apps/${{ matrix.service }}
      - name: Trivy image scan (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: securebank/${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

  helm-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint deploy/helm/banking-service -f deploy/helm/banking-service/values.yaml -f deploy/helm/banking-service/values-${{ matrix.env }}.yaml
      - name: Helm template
        run: helm template test deploy/helm/banking-service -f deploy/helm/banking-service/values.yaml -f deploy/helm/banking-service/values-${{ matrix.env }}.yaml > /dev/null
