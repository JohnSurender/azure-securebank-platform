name: terraform-apply

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  apply:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1          # promote dev -> staging -> prod in order
      matrix:
        env: [dev, staging, prod]
    environment: ${{ matrix.env }}   # staging/prod have required reviewers
    concurrency: tf-${{ matrix.env }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - run: terraform -chdir=infra/envs/${{ matrix.env }} init -input=false
      - run: terraform -chdir=infra/envs/${{ matrix.env }} plan -input=false -out=tfplan
      - run: terraform -chdir=infra/envs/${{ matrix.env }} apply -input=false tfplan
