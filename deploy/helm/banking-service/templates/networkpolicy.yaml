# Only the App Gateway ingress and other SecureBank pods may reach this service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "svc.name" . }}
spec:
  podSelector:
    matchLabels: {{- include "svc.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: securebank
        - ipBlock:
            cidr: 10.0.0.0/8   # App Gateway subnet lives in the hub VNet
      ports:
        - port: {{ .Values.containerPort }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: securebank
    - to:
        - ipBlock: { cidr: 10.0.0.0/8 }   # private endpoints (PostgreSQL, Key Vault)
      ports:
        - { port: 5432, protocol: TCP }
        - { port: 443, protocol: TCP }
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { port: 53, protocol: UDP }
